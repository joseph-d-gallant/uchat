events {}
http {
    
    server {

        listen 80;
    #Entry point, loads the html for the login page for the client
	location / {

            proxy_pass http://client:5005/;

        }
    #Gets data from form html, then makes a post request to the server for verification. Gets a cookie/token back in return
    location /login {

            proxy_pass http://client:5005/login;

        }

    #Gets data from a form, gets the token from the broswer cookie and attaches it to the header, then submits the data to the server service 
    location /submit {

            proxy_pass http://client:5005/submit;

        }
    #Get's a request from client to validate credentials and return some data (messages)
    location /connect {

            proxy_pass http://server:5500/connect;
            
        }
    #Server side handles various types of data requests like retrievals for chats associated with a certain room
    location /handle/ {

            proxy_pass http://server:5500/handle/;
            
        }
    }
}