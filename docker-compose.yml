services:
  client:
    build: ./src/uchat/client
    ports:
      - "5005:5005"
  server:
    build: ./src/uchat/server
    ports:
      - "5500:5500"
  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
  redis:
    image: redis
    ports:
      - "6379:6379"